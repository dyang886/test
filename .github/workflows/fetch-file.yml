name: Fetch file

# Downloads a URL from a GitHub runner and publishes it as an artifact.
#
# Why this exists: the target file sits on a mirror that Charter/Spectrum's CUJO
# filter blocks at the TLS layer from home connections, while the site that links
# to it (gtrainers.com) sits behind Cloudflare and challenges datacenter IPs. So
# neither a home machine nor a runner can walk the whole chain - but the runner
# CAN reach the mirror directly, which is what this does. Give it the final URL.
#
# Run from the Actions tab -> "Fetch file" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct file URL (NOT the Cloudflare-fronted page)"
        required: true
        default: "https://ochki-v.narod.ru/trainers0520192/l/left4dead2/Left_4_Dead_2_V12.05.2019_Trainer_3_MrAntiFun.zips"
      referer:
        description: "Referer header to send"
        required: false
        default: "https://gtrainers.com/"
      filename:
        description: "Name to save the payload as"
        required: false
        default: "Left_4_Dead_2_V12.05.2019_Trainer_3_MrAntiFun.zip"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe and download
        # Default shell is `bash -eo pipefail`, which aborts the step on the first
        # non-zero exit - useless here, since failing attempts are the diagnostic.
        shell: bash {0}
        env:
          URL: ${{ inputs.url }}
          REFERER: ${{ inputs.referer }}
          FILENAME: ${{ inputs.filename }}
        run: |
          mkdir -p out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
          HTTP_URL=$(printf '%s' "$URL" | sed 's#^https://#http://#')

          echo "Runner egress IP: $(curl -sS -m 20 https://api.ipify.org || echo unknown)"
          echo "Target: $URL"
          echo

          attempt () {
            label="$1"; target="$2"; shift 2
            if [ -z "$target" ]; then echo "-- [$label] no URL, skipped"; return 0; fi
            echo "::group::[$label] $target"
            curl -sS -L --max-time 180 --retry 2 --retry-delay 3 \
                 -A "$UA" -e "$REFERER" \
                 -D "out/h_$label.txt" -o "out/p_$label.bin" \
                 -w 'http=%{http_code} size=%{size_download} time=%{time_total}s final=%{url_effective}\n' \
                 "$@" "$target" 2>"out/e_$label.txt"
            echo "curl exit: $?"
            if [ -s "out/e_$label.txt" ]; then echo "stderr:"; cat "out/e_$label.txt"; fi
            if [ -s "out/h_$label.txt" ]; then echo "headers:"; head -20 "out/h_$label.txt" | tr -d '\r'; fi
            if [ -f "out/p_$label.bin" ]; then
              sz=$(stat -c%s "out/p_$label.bin")
              echo "bytes: $sz"
              if [ "$sz" -gt 0 ] && [ "$sz" -lt 2048 ]; then
                echo "head of body:"; head -c 300 "out/p_$label.bin" | tr -d '\0'; echo
              fi
            fi
            echo "::endgroup::"
            return 0
          }

          attempt direct_https "$URL"
          attempt direct_http  "$HTTP_URL"
          attempt direct_noverify "$URL" -k
          attempt direct_bare "$URL" -H 'Referer;' -A 'curl/8'

          best=""; bestsz=0
          for f in out/p_*.bin; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt "$bestsz" ]; then bestsz=$sz; best="$f"; fi
          done

          echo "=================================================="
          if [ -z "$best" ] || [ "$bestsz" -lt 2048 ]; then
            echo "::error::No attempt returned a usable payload (largest was ${bestsz} bytes). See groups above; headers/stderr are in the artifact."
            exit 1
          fi

          name="$FILENAME"
          if [ -z "$name" ]; then name=$(basename "$URL" | sed 's/\.zips$/.zip/'); fi
          cp "$best" "out/$name"
          echo "Winning attempt: $best -> $name ($bestsz bytes)"

          echo "::group::Identification"
          file "out/$name"
          sha256sum "out/$name"
          md5sum "out/$name"
          echo "::endgroup::"

          if unzip -tqq "out/$name" 2>/dev/null; then
            echo "::group::Archive contents"; unzip -l "out/$name"; echo "::endgroup::"
          elif 7z t "out/$name" >/dev/null 2>&1; then
            echo "::group::Archive contents (7z)"; 7z l "out/$name"; echo "::endgroup::"
          else
            echo "Note: not a readable zip/7z archive."
          fi

          {
            echo "### Fetched \`$name\`"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| url | \`$URL\` |"
            echo "| winning attempt | \`$best\` |"
            echo "| size | $bestsz bytes |"
            echo "| sha256 | \`$(sha256sum "out/$name" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-file
          path: out/
          retention-days: 7
          if-no-files-found: warn
